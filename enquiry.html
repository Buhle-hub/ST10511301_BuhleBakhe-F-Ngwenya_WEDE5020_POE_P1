<h2>Get Involved</h2>

<p>Thank you for your interest in Pretoria Community Kitchen. Please complete the form below and we will get back to you. </p>



<h2>Enquiry Form</h2>

 <form>

<div class="form-group">
<label for="full-name">Full Name:</label>

<input
type="text"
 id="full-name"
name="full-name"
placeholder="Enter your full name"
required
>
                    
</div>

                
<div class="form-group">
<label for="email">Email Address:</label>

<input
type="email"
id="email"
name="email"
placeholder="Enter your email address"
required
>
</div>

                
<div class="form-group">
<label for="phone">Phone Number:</label>

<input
type="tel"
id="phone"
name="phone"
placeholder="Enter your phone number"
required
 >
</div>

                
<div class="form-group">
<label for="enquiry-type">Type of Enquiry:</label>

<select
 id="enquiry-type"
name="enquiry-type"
required
 >
<option value="">
    select an option 
</option>

 <option value="volunteer">
    volunteering
</option>

<option value="donation">
    donation
</option>

<option value="sponsorship">
    sponsorship
</option>

<option value="general">
    general enquiry
</option>
 </select
 >
</div>

<div class="form-group">
<button type="submit">
</button>
</div>

</form>

<footer>
    <p> Pretoria Community Kitchen</p>
    </footer>
