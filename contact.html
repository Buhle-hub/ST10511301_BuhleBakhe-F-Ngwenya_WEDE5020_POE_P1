<html>
<head></head>

<title>Contact Us - Pretoria Community Kitchen</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact Pretoria Community Kitchen Pretoria CBD">
<meta name="keywords" content="Pretoria Community Kitchen contact, Pretoria CBD">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
.myHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:white;
  padding:14px 28px;
  border-bottom:1px solid #eee;

  font-weight:bold;
  margin:0;

.myNav a.active{

  height:360px;

<body style="margin:0; background:white; font-family:Arial;">
  

<div class="myHeader">
  <div class="left">
    <img src="images/logo.jpeg"Pretoria Community Kitchen logo Pretoria">
    <h1>Pretoria Community Kitchen</h1>
  </div>
  <div class="myNav">
    <a href="index.html">Home</a>

    <a href="services.html">Services</a>

    <a href="contact.html" class="active">Contact</a>
  </div>

<div style="padding:20px 28px;">
  <h1>Contact Us</h1>
  <p>We are based in Pretoria CBD. You can find us on the map below. Click the marker for clearer directions</p>
  


<div id="map" style="width:95%; height:400px; border:2px solid #EA6D1A; border-radius:10px; margin:15px 0;"></div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>
  var map = L.map('map').setView([-25.7479, 28.2293], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
  L.marker([-25.7479, 28.2293]).addTo(map)
    .bindPopup('<b>Pretoria Community Kitchen</b><br>We are here!')
    .openPopup();
</script>

<section style="padding: 30px; max-width: 700px; margin: auto;
background: #fff; border-radius: 10px;">

<h2> Send message</h2>
<form id="contactForm" novalidate style="display: flex; flex-direction: column; gap: 12px;">

  <label for="fullName">Full Name </label>
  <input type="text" id="fullName" name="fullName" required style="padding:12px; border:1px solid #ccc; border-radius:6px;">
  <span class="error" id="fullNameError" style="color:red; font-size:0.9em;"></span>

  <label for="email">Email </label>
  <input type="email" id="email" name="email" required style="padding:12px; border:1px solid #ccc; border-radius:6px;">
  <span class="error" id="emailError" style="color:red; font-size:0.9em;"></span>

  <label for="phone">Phone Number</label>
  <input type="tel" id="phone" name="phone" style="padding:12px; border:1px solid #ccc; border-radius:6px;">

  <label for="reason">Reason to Contact </label>
  <select id="reason" name="reason" required style="padding:12px; border:1px solid #ccc; border-radius:6px;">
    <option value=""> Please Select </option>
    <option value="volunteer">Volunteer</option>
    <option value="donation">Donation</option>
    <option value="meal-request">Request a Meal</option>
    <option value="general">General Enquiry</option>
  </select>
  <span class="error" id="reasonError" style="color:red; font-size:0.9em;"></span>

  <label>How should we contact you?</label>
  <div style="display:flex; gap:15px;">
    <label><input type="checkbox" id="contactEmail"> Email</label>
    <label><input type="checkbox" id="contactPhone"> Phone</label>
  </div>

  <label for="message">Message </label>
  <textarea id="message" name="message" rows="5" required style="padding:12px; border:1px solid #ccc; border-radius:6px;"></textarea>
  <span class="error" id="messageError" style="color:red; font-size:0.9em;"></span>

  <button type="button" onclick="validateContact()" style="padding: 14px; background:#000; color:white; border:none; border-radius:25px; cursor:pointer; font-size:1rem;">Send Message</button>
  <p id="contactSuccess" style="color:green; font-weight:bold; margin-top:10px;"></p>
  
</form>
</section>
<script>
  
  function validateContact(){
  

  const fnErr = document.getElementById("fullNameError");
  const emErr = document.getElementById("emailError");
  const rsErr = document.getElementById("reasonError");
  const msErr = document.getElementById("messageError");
  const ok = document.getElementById("contactSuccess");
  const bad = document.getElementById("contactError");
  
  if(fnErr) fnErr.textContent = "";
  if(emErr) emErr.textContent = "";
  if(rsErr) rsErr.textContent = "";
  if(msErr) msErr.textContent = "";
  if(ok) ok.textContent = "";
  if(bad) bad.textContent = "";

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const reason = document.getElementById("reason").value;
  const message = document.getElementById("message").value.trim();

  if(fullName === ""){
    if(fnErr) fnErr.textContent = "Please enter your full name.";
    return;
  }
  if(email === "" || !email.includes("@") || !email.includes(".")){
    if(emErr) emErr.textContent = "Please enter a valid email address.";
    else alert("Please enter a valid email address.");
    return;
  }
  if(reason === ""){
    if(rsErr) rsErr.textContent = "Please select a Reason to Contact.";
    else if(bad) bad.textContent = "Please select a Reason to Contact.";
    else alert("Please select a Reason to Contact.");
    return;
  }
  if(message.length < 10){
    if(msErr) msErr.textContent = "Message must be at least 10 characters.";
    else if(bad) bad.textContent = "Message must be at least 10 characters.";
    else alert("Message must be at least 10 characters.");
    return;
  }
  if(ok) ok.textContent = "Thank you " + fullName + "! Your enquiry about " + reason + " was received. We will contact you at " + email + " within 24 hours.";
  document.getElementById("contactForm").reset();
}
</script>
<script src="js/script.js"></script>
</body>
</html>
